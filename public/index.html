<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>Wall Display</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
<script>
  // The layout is authored at a fixed 1280x800 and scaled to fit whatever
  // viewport it lands in (Fire panel, laptop window, kiosk with a nav bar).
  (function () {
    function fit() {
      var el = document.documentElement;
      var vw = el.clientWidth || window.innerWidth;
      var vh = el.clientHeight || window.innerHeight;
      if (!vw || !vh) return;
      el.style.setProperty('--fit', Math.min(vw / 1280, vh / 800));
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    window.addEventListener('load', fit);
    document.addEventListener('DOMContentLoaded', fit);
    // Kiosk browsers settle their viewport (hiding bars, etc.) a beat after
    // load -- re-measure a few times early on.
    var n = 0;
    var t = setInterval(function () { fit(); if (++n > 12) clearInterval(t); }, 200);
    fit();
  })();
</script>
</head>
<body>
<div id="screen">
  <header id="topbar">
    <div class="now">
      <div id="clock">--:--</div>
      <div id="date">&nbsp;</div>
    </div>
    <button id="camBtn" type="button" hidden>
      <span class="cam-ico">📷</span><span class="cam-lbl">Cameras</span>
    </button>
    <div class="wx-now" id="wxNow">
      <div class="wx-now-main">
        <span class="wx-icon" id="wxIcon">·</span>
        <span class="wx-temp" id="wxTemp">--°</span>
      </div>
      <div class="wx-now-meta">
        <div id="wxDesc">&nbsp;</div>
        <div id="wxExtra" class="dim">&nbsp;</div>
      </div>
    </div>
  </header>

  <main id="body">
    <section id="agenda">
      <div class="loading" id="agendaLoading">Loading calendar…</div>
    </section>

    <aside id="rail">
      <div class="card">
        <h2>Hourly</h2>
        <div id="hourly" class="hourly"></div>
      </div>
      <div class="card">
        <h2>Forecast</h2>
        <div id="forecast" class="forecast"></div>
      </div>
    </aside>
  </main>

  <footer id="statusbar">
    <span id="calLegend" class="legend"></span>
    <span id="status" class="dim"></span>
  </footer>

  <div id="camOverlay" hidden>
    <button id="camClose" type="button" aria-label="Close cameras">✕</button>
    <div id="camGrid"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
