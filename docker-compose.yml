# Portainer stack for wall-display.
#
# Two ways to deploy in Portainer:
#
#  A) Stacks -> Add stack -> "Repository": point at this git repo. Portainer
#     runs `docker compose` with the build step below.
#
#  B) Stacks -> Add stack -> "Web editor": paste this file, but change the
#     `build:` line to `image: wall-display:latest` and build/push that image
#     yourself first (Portainer web-editor stacks can't build from context).
#
# Either way, create the config file on the host first:
#   mkdir -p /opt/wall-display/config
#   cp config.example.json /opt/wall-display/config/config.json   # then edit it
# and set WALL_DISPLAY_CONFIG_DIR below (or hard-code the volume source path).

services:
  wall-display:
    build: .
    image: wall-display:latest
    container_name: wall-display
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Container clock -- drives "Today/Tomorrow" grouping on the server side.
      TZ: "America/Chicago"
      # NWS asks anonymous clients to identify themselves; a bare email is fine.
      NWS_USER_AGENT: "kindle-wall-display - you@example.com"
    volumes:
      - ${WALL_DISPLAY_CONFIG_DIR:-/opt/wall-display/config}:/app/config:ro
