# Portainer stack for wall-display.
#
# Deploy: Stacks -> Add stack -> "Repository", point at this repo (branch main,
# compose path docker-compose.yml). Portainer builds the image from the Dockerfile.
#
# CONFIG -- pick ONE of these:
#
#  A) All-in-Portainer (no host shell needed). Set CALENDARS_JSON below to a
#     one-line JSON array of {name,color,url} objects, plus TZ / NWS_USER_AGENT /
#     LAT / LON as needed. Delete the `volumes:` block. Trade-off: the iCal URLs
#     are visible in the Portainer UI / `docker inspect`.
#
#  B) Bind-mounted file. On the Docker host:
#         mkdir -p /opt/wall-display/config
#         # put config.json there (see config.example.json)
#     Keep the `volumes:` block. URLs stay in that file only.

services:
  wall-display:
    build: .
    image: wall-display:latest
    container_name: wall-display
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Container clock -- drives "Today/Tomorrow" grouping on the server side.
      TZ: "America/Chicago"
      # NWS asks anonymous clients to identify themselves; a bare email is fine.
      NWS_USER_AGENT: "family-screen - you@example.com"
      # Option A only -- a JSON array on one line. Leave unset if using the file.
      # CALENDARS_JSON: '[{"name":"Justin","color":"#4d9de0","url":"https://..."},{"name":"Carrie","color":"#a855f7","url":"https://..."}]'
      # Optional: override the Cape Girardeau default point.
      # LAT: "37.3059"
      # LON: "-89.5181"
    volumes:
      # Option B only -- delete this block if you set CALENDARS_JSON above.
      - ${WALL_DISPLAY_CONFIG_DIR:-/opt/wall-display/config}:/app/config:ro
